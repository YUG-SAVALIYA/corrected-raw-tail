[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-supertrend-backtester"
version = "0.1.0"
description = "IDE-friendly RSI and Supertrend trading signal generator and backtester"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0.0",
  "duckdb>=1.0.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "scikit-learn>=1.5.0",
  "lightgbm>=4.5.0",
  "catboost>=1.2.0",
  "optuna>=4.0.0",
  "pydantic>=2.6.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "pyarrow>=16.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "matplotlib>=3.8.0",
  "joblib>=1.4.0",
  "ta-lib>=0.4.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.6.1",
  "tenacity>=9.0.0",
  "aiofiles>=24.1.0"
]

[project.scripts]
trade-backtest = "rsi_supertrend_backtester.cli:main"
nifty = "nifty_research.cli:main"

[project.optional-dependencies]
sequence-models = ["torch>=2.14.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
