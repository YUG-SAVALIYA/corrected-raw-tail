# Same 98-feature HGB as the original experiment, regenerated to emit
# continuous raw-score percentile thresholds alongside calibrated ones.
features_path: ../artifacts/nifty_phase2_higher_timeframe_market_index/features.parquet
labels_path: ../artifacts/nifty_phase2_higher_timeframe_market_index/labels.parquet
output_dir: ../artifacts/retrained_nifty_hgb_direct_short_market_index_raw_tail_walkforward_2020_2026
initial_train_end: '2019-12-31'
evaluation_start: '2020-01-01'
evaluation_end: '2026-10-16'
retrain_frequency: yearly
calibration_months: 6
early_stopping_months: 3
max_train_rows: 500000
max_calibration_rows: 250000
random_state: 42
n_jobs: 4
models: [hist_gradient_boosting]
emit_ensemble: false
fit_return_regressor: false
classification_target: short_return_threshold
short_return_threshold: -0.012
short_calibration_quantiles: [0.99, 0.995, 0.997, 0.999, 0.9995, 0.9997, 0.9999]

